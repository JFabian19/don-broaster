<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 420" width="100%" height="100%">
  <defs>
    <style>
      @import url('https://fonts.googleapis.com/css2?family=Anton&amp;family=Caveat:wght@700&amp;display=swap');
      .title-text {
        font-family: 'Anton', 'Impact', sans-serif;
        fill: #EE2B2E;
        stroke: #EE2B2E;
        stroke-width: 1px;
        letter-spacing: 2px;
      }
      .slogan-text {
        font-family: 'Caveat', 'Dancing Script', cursive;
        font-size: 38px;
        font-weight: 700;
        fill: #1A1A1A;
      }
    </style>
  </defs>

  <!-- Background -->
  <rect width="100%" height="100%" fill="#FFFFFF" rx="16"/>

  <!-- Yellow Double Border Frame -->
  <rect x="35" y="35" width="430" height="260" fill="none" stroke="#F5A623" stroke-width="12" rx="4"/>

  <!-- DON Text -->
  <text x="250" y="175" text-anchor="middle" class="title-text" font-size="145" font-weight="900">DON</text>
  
  <!-- White inner stroke overlay for DON text stencil effect -->
  <text x="250" y="175" text-anchor="middle" font-family="'Anton', 'Impact', sans-serif" font-size="145" font-weight="900" fill="none" stroke="#FFFFFF" stroke-width="3" letter-spacing="2">DON</text>

  <!-- BROASTER Text -->
  <text x="250" y="268" text-anchor="middle" class="title-text" font-size="82" font-weight="900">BROASTER</text>
  
  <!-- White inner stroke overlay for BROASTER text stencil effect -->
  <text x="250" y="268" text-anchor="middle" font-family="'Anton', 'Impact', sans-serif" font-size="82" font-weight="900" fill="none" stroke="#FFFFFF" stroke-width="2.5" letter-spacing="2">BROASTER</text>

  <!-- Se prepara con cariño -->
  <text x="250" y="355" text-anchor="middle" class="slogan-text">Se prepara con cariño</text>
</svg>
